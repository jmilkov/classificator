services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      PORT: "3000"
      NODE_ENV: "development"
      CALL_MEDIA_TYPE_ID: "${CALL_MEDIA_TYPE_ID:-5}"
      DEFAULT_PAGE_SIZE: "${DEFAULT_PAGE_SIZE:-20}"
      MAX_PAGE_SIZE: "${MAX_PAGE_SIZE:-100}"
      ANCHOR_STEP: "${ANCHOR_STEP:-10}"
      ANCHOR_TTL_SECONDS: "${ANCHOR_TTL_SECONDS:-1800}"
      DEFAULT_MASTER: "${DEFAULT_MASTER:-1}"
      DEFAULT_AREA: "${DEFAULT_AREA:-}"
      DEFAULT_AREAS: "${DEFAULT_AREAS:-}"

    user: root
    restart: unless-stopped
    volumes:
      - ./workers:/app/workers
      - node_modules_api:/app/node_modules
      - ./public:/app/public
      - uploads_data:/app/public/uploads

  nginx:
    image: nginx:alpine
    ports:
      - "3082:80"
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/app/public/uploads
    depends_on:
      - api

volumes:
  node_modules_api:
  uploads_data: